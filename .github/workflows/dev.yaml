name: Development CI

on:
  pull_request:
    branches: [ develop ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      - name: Install Dependencies
        run: npm install

      - name: Run HTML Lint
        run: npx htmlhint pages/  # Lints all HTML files in the pages directory

      - name: Run CSS Lint
        run: npx stylelint "styles/**/*.css"  # Lints all CSS files in the styles directory

      - name: Build Project
        run: echo "Building project..."
        
       

